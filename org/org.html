---
layout: base
title: 조직도
heading: 조직도
sub: 누가 뭘 맡았나
crumb: 조합
---
{% assign org = site.data.org %}
<section>
  <header><span class="no">01</span><h2>임원과 직원</h2></header>
  <ul class="roles body">
    {% for p in org.people %}
    <li><span class="role">{{ p.role }}</span><span>{{ p.name }}</span></li>
    {% endfor %}
  </ul>
</section>

{% if org.image %}
<section>
  <header><span class="no">02</span><h2>그림으로</h2></header>
  <div class="body gallery contain one">
    <figure><img src="{{ org.image | relative_url }}" alt="거거덩 협동조합 조직도" loading="lazy"></figure>
  </div>
</section>
{% endif %}
