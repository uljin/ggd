---
layout: base
title: 거거덩네컷
heading: 거거덩네컷
sub: 거거덩 로고가 박힌 네 컷 사진
crumb: 놀이
plane: true
description: 거거덩 로고가 박힌 네 컷 사진을 휴대폰이나 노트북 카메라로 바로 찍어요. 사진은 서버로 올라가지 않아요.
---
<section class="booth">
  <header><span class="no">01</span><h2>찍기</h2><p>사진은 이 기기 안에서만 만들어지고, 어디에도 올라가지 않아요.</p></header>
  <div class="body">
    <div class="booth-stage">
      <video playsinline muted></video>
      <canvas class="booth-result" hidden></canvas>
      <div class="booth-count" aria-live="polite"></div>
      <div class="booth-flash"></div>
      <p class="booth-msg" hidden>카메라를 켜면 여기 화면이 나와요.</p>
      <button type="button" class="b-start" aria-label="카메라 켜기">
        <svg viewBox="0 0 64 48" width="64" height="48" aria-hidden="true"><path d="M6 12h12l5-7h18l5 7h12v31H6z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><circle cx="32" cy="27" r="10" fill="none" stroke="currentColor" stroke-width="3"/></svg>
        <span>카메라 켜기</span>
      </button>
      <button type="button" class="b-shoot" hidden aria-label="네 컷 찍기"><i></i><span>네 컷 찍기</span></button>
    </div>
    <div class="booth-thumbs" aria-label="찍은 컷"></div>
    <div class="booth-frames" role="radiogroup" aria-label="틀 색">
      <span>틀</span>
      <button type="button" data-frame="paper" aria-pressed="true">종이</button>
      <button type="button" data-frame="green" aria-pressed="false">초록</button>
    </div>
    <div class="booth-frames" role="radiogroup" aria-label="모양">
      <span>모양</span>
      <button type="button" data-layout="strip" aria-pressed="true">네컷 띠</button>
      <button type="button" data-layout="grid" aria-pressed="false">2×2</button>
    </div>
    <div class="booth-actions">
      <button type="button" class="b-save" hidden>저장 ↓</button>
      <button type="button" class="b-share" hidden>공유 ↗</button>
      <button type="button" class="b-again" hidden>다시 찍기</button>
    </div>
  </div>
</section>

<script>
(function () {
  var root = document.querySelector(".booth");
  var video = root.querySelector("video"), out = root.querySelector(".booth-result");
  var count = root.querySelector(".booth-count"), flash = root.querySelector(".booth-flash"), msg = root.querySelector(".booth-msg");
  var thumbs = root.querySelector(".booth-thumbs");
  var btn = function (c) { return root.querySelector(".b-" + c); };
  var shots = [], stream = null, frame = "paper", layout = "strip";
  var logo = new Image(); logo.src = "{{ '/images/ggd_logo.JPG' | relative_url }}";
  var COLORS = { paper: "#f4f2ee", green: "#5cb96b" }, INK = "#111111";
  var W = 600, PAD = 30, GAP = 18, PW = W - PAD * 2, PH = Math.round(PW * 3 / 4), FOOT = 250;
  var H = PAD + PH * 4 + GAP * 3 + FOOT;

  function show(name, on) { btn(name).hidden = !on; }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  btn("start").addEventListener("click", async function () {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
      video.srcObject = stream; await video.play();
      show("start", false); show("shoot", true);
    } catch (e) {
      msg.hidden = false; msg.textContent = "카메라를 켤 수 없어요. 브라우저에서 카메라 권한을 허용했는지 확인해 주세요.";
    }
  });

  function grab() {   // 화면에 보이는 그대로(거울상) 4:3으로 잘라 저장
    var vw = video.videoWidth, vh = video.videoHeight, r = 4 / 3, sw = vw, sh = vw / r;
    if (sh > vh) { sh = vh; sw = vh * r; }
    var c = document.createElement("canvas"); c.width = PW * 2; c.height = PH * 2;
    var x = c.getContext("2d");
    x.translate(c.width, 0); x.scale(-1, 1);
    x.drawImage(video, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, c.width, c.height);
    return c;
  }

  btn("shoot").addEventListener("click", async function () {
    shots = []; thumbs.innerHTML = ""; show("shoot", false);
    for (var i = 0; i < 4; i++) {
      for (var n = 3; n > 0; n--) { count.textContent = (i + 1) + "컷 · " + n; await wait(800); }
      count.textContent = "";
      flash.classList.add("on"); var shot = grab(); setTimeout(function () { flash.classList.remove("on"); }, 150);
      shots.push(shot);
      var t = document.createElement("img"); t.src = shot.toDataURL("image/jpeg", 0.6); t.alt = (i + 1) + "번째 컷"; thumbs.appendChild(t);
      await wait(500);
    }
    compose();
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    root.querySelector(".booth-stage").classList.add("done"); out.hidden = false; thumbs.hidden = true;
    root.querySelector(".booth-stage").scrollIntoView({ block: "start", behavior: "smooth" });
    show("save", true); show("again", true);
    show("share", !!(navigator.canShare && navigator.canShare({ files: [new File([""], "a.png", { type: "image/png" })] })));
  });

  function today() {
    var d = new Date();
    return d.getFullYear() + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getDate()).padStart(2, "0");
  }

  var BOARD = { paper: "#5cb96b", green: "#f4f2ee" };   // 띠 뒤 판은 틀과 반대 색

  function compose() {
    if (!shots.length) return;
    var R = 2;
    if (layout === "strip") {           // 인스타 스토리 크기(9:16) 판 위에 세로 띠 한 장
      var BW = 1080, BH = 1920;
      out.width = BW * R; out.height = BH * R;
      var x = out.getContext("2d"); x.setTransform(R, 0, 0, R, 0, 0);
      x.fillStyle = BOARD[frame]; x.fillRect(0, 0, BW, BH);
      var sh = BH - 240, sw = sh * W / H, sx = (BW - sw) / 2, sy = 110;
      x.save(); x.translate(sx, sy); x.scale(sw / W, sh / H); strip(x); x.restore();
      x.fillStyle = INK; x.font = "400 26px 'IBM Plex Sans KR', sans-serif"; x.textAlign = "center";
      x.fillText("ggdcoop.com", BW / 2, BH - 52); x.textAlign = "left";
    } else {                            // 정사각형 2×2
      var S = 1080;
      out.width = S * R; out.height = S * R;
      var y = out.getContext("2d"); y.setTransform(R, 0, 0, R, 0, 0);
      y.fillStyle = COLORS[frame]; y.fillRect(0, 0, S, S);
      grid(y, S);
      y.strokeStyle = INK; y.lineWidth = 6; y.strokeRect(3, 3, S - 6, S - 6);
    }
  }

  function strip(x) {   // 세로 네 컷 띠 (W × H 좌표계)
    x.fillStyle = COLORS[frame]; x.fillRect(0, 0, W, H);
    shots.forEach(function (s, i) {
      var y = PAD + i * (PH + GAP);
      x.drawImage(s, PAD, y, PW, PH);
      x.strokeStyle = INK; x.lineWidth = 2; x.strokeRect(PAD, y, PW, PH);
    });
    var fy = PAD + PH * 4 + GAP * 3;
    x.fillStyle = INK; x.fillRect(PAD, fy + 18, PW, 4);
    x.globalCompositeOperation = "multiply";
    var lw = 380, lh = lw * logo.naturalHeight / logo.naturalWidth;
    x.drawImage(logo, PAD, fy + 46, lw, lh);
    x.globalCompositeOperation = "source-over";
    x.fillStyle = INK; x.font = "400 18px 'IBM Plex Sans KR', sans-serif";
    x.fillText("GGD Cooperative · " + today(), PAD, H - PAD);
    x.strokeStyle = INK; x.lineWidth = 4; x.strokeRect(2, 2, W - 4, H - 4);
  }

  function grid(x, S) {   // 2×2 네 컷 + 아래 로고 띠
    var m = 48, g = 20, cw = (S - m * 2 - g) / 2, ch = cw * 3 / 4;
    shots.forEach(function (s, i) {
      var cx = m + (i % 2) * (cw + g), cy = m + Math.floor(i / 2) * (ch + g);
      x.drawImage(s, cx, cy, cw, ch);
      x.strokeStyle = INK; x.lineWidth = 2; x.strokeRect(cx, cy, cw, ch);
    });
    var fy = m + ch * 2 + g + 24;
    x.fillStyle = INK; x.fillRect(m, fy, S - m * 2, 5);
    x.globalCompositeOperation = "multiply";
    var lh = S - fy - 40 - m, lw = lh * logo.naturalWidth / logo.naturalHeight;
    x.drawImage(logo, m, fy + 28, lw, lh);
    x.globalCompositeOperation = "source-over";
    x.fillStyle = INK; x.textAlign = "right";
    x.font = "700 26px 'IBM Plex Sans KR', sans-serif"; x.fillText("GGD Cooperative", S - m, S - m - 34);
    x.font = "400 22px 'IBM Plex Sans KR', sans-serif"; x.fillText(today(), S - m, S - m);
    x.textAlign = "left";
  }

  root.querySelectorAll("[data-layout]").forEach(function (b) {
    b.addEventListener("click", function () {
      layout = b.dataset.layout;
      root.querySelectorAll("[data-layout]").forEach(function (o) { o.setAttribute("aria-pressed", o === b); });
      compose();
    });
  });

  root.querySelectorAll("[data-frame]").forEach(function (b) {
    b.addEventListener("click", function () {
      frame = b.dataset.frame;
      root.querySelectorAll("[data-frame]").forEach(function (o) { o.setAttribute("aria-pressed", o === b); });
      compose();
    });
  });

  function fileName() { return "ggd-4cut-" + Date.now() + ".png"; }
  btn("save").addEventListener("click", function () {
    out.toBlob(function (blob) {
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fileName();
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    }, "image/png");
  });
  btn("share").addEventListener("click", function () {
    out.toBlob(function (blob) {
      var f = new File([blob], fileName(), { type: "image/png" });
      navigator.share({ files: [f], title: "거거덩네컷" }).catch(function () {});
    }, "image/png");
  });
  btn("again").addEventListener("click", function () { location.reload(); });
})();
</script>
